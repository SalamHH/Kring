# M1 step 10 (F4): Hjem with a new place, its status row, the incident screen, pull to refresh.
# Needs the iOS Simulator with the dev build, Metro and an API (local or Render; mobile/README.md).
# The flow makes «E2E Hjem» and deletes it at the end. Assertions don't depend on which incidents
# exist: the status row is one of incident, calm or the small-radius note.
appId: no.kring.app
name: Hjem – kort, statusrad og hendelse
---
- runFlow: open-dev-build.yaml
- assertVisible: "Dine steder"
- assertVisible:
    id: "updated"

# A place to look at
- tapOn:
    id: "add-place"
- tapOn:
    id: "search-input"
- inputText: "Grensen 10"
- extendedWaitUntil:
    visible:
      id: "search-result-0"
    timeout: 10000
- tapOn:
    id: "search-result-0"
- tapOn:
    id: "template-annet"
- tapOn:
    id: "label-input"
- eraseText: 30
- inputText: "E2E Hjem"
- hideKeyboard
- tapOn:
    id: "save"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

# The card: label, meta, and one of the three status rows
- extendedWaitUntil:
    visible: ".*E2E Hjem.*Grensen 10 · 1 km · hele døgnet.*"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "(calm|imprecise|incident)-.*"
    timeout: 15000

# Pull to refresh keeps the screen
- swipe:
    from:
      id: "updated"
    direction: DOWN
- assertVisible: ".*E2E Hjem.*"

# An incident row, if there is one, opens the incident and goes back
- runFlow:
    when:
      visible:
        id: "incident-.*"
    commands:
      - tapOn:
          id: "incident-.*"
      - extendedWaitUntil:
          visible: "Oppdateringer fra politiet"
          timeout: 10000
      - tapOn:
          id: "event-back"
      - assertVisible: "Dine steder"

# Clean up: the card opens the place settings, where it is deleted
- tapOn: ".*E2E Hjem.*Grensen 10.*"
- assertVisible: "Endre sted"
- scrollUntilVisible:
    element:
      id: "delete"
    direction: DOWN
- tapOn:
    id: "delete"
- tapOn: "Slett"
- extendedWaitUntil:
    notVisible: ".*E2E Hjem.*"
    timeout: 10000
