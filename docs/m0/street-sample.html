<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M0 street sample</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fbfaf7;--fg:#1f2328;--muted:#656d76;--card:#fff;--line:#e3e1db;--ok:#1a7f37;--bad:#cf222e}
@media (prefers-color-scheme: dark){:root{--bg:#16181c;--fg:#e6e6e6;--muted:#9aa3ad;--card:#1f2228;--line:#30343b;--ok:#3fb950;--bad:#f85149}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 6px} p{margin:4px 0;color:var(--muted)}
#score{position:sticky;top:0;z-index:1000;background:var(--bg);padding:8px 16px;border-bottom:1px solid var(--line);font-weight:600;text-align:center}
main{max-width:1100px;margin:auto;padding:8px 16px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr 340px;overflow:hidden}
.txt{padding:12px 14px} .map{height:260px} .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
.match{font-weight:600} .police{white-space:pre-wrap;margin:8px 0;font-size:14px}
.btns button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;margin-right:6px}
.card.ok{border-color:var(--ok)} .card.bad{border-color:var(--bad)}
.card.ok .b-ok{background:var(--ok);color:#fff} .card.bad .b-bad{background:var(--bad);color:#fff}
@media (max-width:760px){.card{grid-template-columns:1fr}.map{height:220px}}
</style></head><body>
<header><h1>M0 street sample</h1>
<p>25 Oslo incidents placed from a street (exact address, crossing, or street), a fixed sample from
the quarter recorded 2026-11-12. For each: is the matched street the one the incident happened on?
Spec §9.5 asks for ≥ 90 %. The circle is the stated uncertainty.</p></header>
<div id="score"></div><main id="list"></main>
<script>
const ROWS = [{"id": "26bfkr", "category": "Trafikk", "area": "Lambertseter", "text": "Nødetatene er på vei til  Lambertseterveien der det har vært et sammenstøt mellom en bil og en elsparkesykkel. Det fremstår ikke som alvorlige skader. Syklisten fremstår som lettere skadet og blir med til legevakt for sjekk. \n\nPolitiet snakker med vitner og de involverte på stedet. Politiet oppretter sak på vegtrafikkloven §3. Det blir ikke førerkortbeslag.", "match": "Lambertseterveien ved Lambertseter", "method": "gate_omrade", "unc": 903, "lat": 59.87428548717949, "lon": 10.810451602564102}, {"id": "26s1p3", "category": "Trafikk", "area": "Østre Aker Vei", "text": "Ved påkjøringsrampen fra Alfaset ut på Østre Aker vei har det vært en trafikkulykke med en bil involvert.\n\nBilisten har kjørt inn i et tre. Store materielle skader. To personer i bilen som fremstår oppegående. De involverte kjøres legevakt for videre undersøkelser. Bilen er berget. Førerkortet til bilfører er beslaglagt, og vi oppretter sak.", "match": "Østre Aker Vei", "method": "gate_area", "unc": 3129, "lat": 59.939775078125, "lon": 10.851320171875}, {"id": "262h24", "category": "Redning", "area": "Langkaia", "text": "Forbipasserende fant klær og en mobiltelefon liggende ved Salt og både melder og vi fryktet at personen var ute i vannet. Undersøkelser fant ut at personen hadde klatret ned i vannet før kl 07. Litt over kl 08 ringte en båtfører til AMK og hadde funnet en nedkjølt svømmer ute i havnebassenget. Dette viste seg å være personen hvis mobil og klær lå igjen på kaia. Vedkommende får nå oppfølging av ambulansen. Vedkommende blir som nevnt ivaretatt av helse. Politiet avslutter på stedet.", "match": "Langkaia", "method": "gate_area", "unc": 50, "lat": 59.907603, "lon": 10.746881}, {"id": "26mzt9", "category": "Trafikk", "area": "Høybråten", "text": "Politiet og ambulanse er på vei til Høybråtenveien hvor vi har fått melding om en trafikkulykke mellom sparkesykkel og bil. Det er ukjent skadeomfang, men det fremstår ikke alvorlig per nå. Sparkesyklisten halter litt, men fremstår ellers uskadd. Han sjekkes ut av ambulanse på stedet. Politiet tar avhør av bilfører. El-sparkesyklisten har kommet kjørende over et gangfelt og blitt påkjørt. Politiet oppretter sak og tar beslag i førerkortet til bilfører.", "match": "Høybråtenveien ved Høybråten", "method": "gate_omrade", "unc": 803, "lat": 59.944885978609626, "lon": 10.912372064171123}, {"id": "26hxbd", "category": "Trafikk", "area": "Sørkedalen", "text": "Politiet er sammen med ambulanse i Sørkedalen på en sykkelulykke i Zinoberveien. Ambulanse jobber med pasienten. Skadeomfang er alvorlig, men uavklart. En person er bekreftet omkommet etter det som fremstår som en singelulykke på sykkel. Vi har patruljer fra seksjon for Trafikktjeneste som ivaretar åstedet og etterforskningen. Avdødes nærmeste pårørende er varslet. Vi er ferdig på stedet, vi har gjennomført et åstedsgranskning, tatt beslag i sykkelen for videre undersøkelser. Per nå er det for tidlig å si noe om årsaken, vi trenger tid på å undersøke våre tekniske funn. Avdøde hadde på seg hjelm da han ble funnet.", "match": "Zinoberveien ved Sørkedalen", "method": "gate_omrade", "unc": 921, "lat": 60.01227671428571, "lon": 10.625414428571428}, {"id": "26rtrq", "category": "Trafikk", "area": "Romsås", "text": "Nødetatene er på vei til Odvar Solbergs vei hvor en bil har kjørt inn i en parkert bil. Det er en del skader på begge bilene. VI er på stedet og har kontroll på føreren. Han sjekkes av ambulanse. Fører blir kjørt legevakt med mulig brudd i nese. Det er mistanke om ruskjøring. Det har vært kun en person i aktuell bil.\n\nDen parkerte bilen har noe skader bak. \n\nBilberger er på stedet. Politiet oppretter sak på kjøring i påvirket tilstand og kjøring uten gyldig førerkort.", "match": "Odvar Solbergs vei", "method": "gate_tekst", "unc": 514, "lat": 59.967348061403506, "lon": 10.900392271929825}, {"id": "2674cv", "category": "Tyveri", "area": "Majorstua", "text": "Melder ble frastjålet elsykkelen sin i Bogstadveien for noen timer siden. Tyven hadde klippet over sykkellåsen og syklet mot Majorstua. \n\nMelder hadde sporing på sykkelen og fant en feilparkert varebil like borti gata hvor sykkelen trolig var gjemt inni, så han ringte oss. Etter litt venting fikk vi kontroll på en mann med tilknytning til bilen som vi mistenker står bak sykkeltyveriet. \n\nBak i bilen stod også en annen sykkel som vi undersøker hvordan har havnet der. Vi har pågrepet mannen da dette ikke er første gang denne måneden han er tatt med stjålne sykler. Bilen er tauet inn og beslaglagt.", "match": "Bogstadveien", "method": "gate_tekst", "unc": 408, "lat": 59.92691079120879, "lon": 10.719962175824175}, {"id": "26dg35", "category": "Brann", "area": "Galgeberg", "text": "Vi er i Normannsgata ifm en utløst brannalarm. Skal være røyk i en leilighet. Ikke bekreftet brann. Ferdig på stedet. Trolig vært et røyknedslag.", "match": "Normannsgata", "method": "gate_tekst", "unc": 346, "lat": 59.91096027272727, "lon": 10.780992579545455}, {"id": "26br6c", "category": "Voldshendelse", "area": "Haarklous Plass.", "text": "Vi er på busstoppet ved Haarklous plass hvor det har vært en voldshendelse inne på en buss. Det er kontroll på både fornærmede og mistenkte. Vi jobber med avhør av partene. Det fremstår ikke at noen er skadet og partene kjenner til hverandre. Mistenkte blir pågrepet og kjørt arrest. \n\nFornærmede blir kjørt legevakt for sjekk. \n\nVi oppretter sak.", "match": "Haarklous Plass", "method": "gate_area", "unc": 108, "lat": 59.93702078947368, "lon": 10.775417631578946}, {"id": "262f5m", "category": "Trafikk", "area": "Smestad", "text": "Vi er i Skøyenveien på Smestad hvor det har vært et mindre trafikkuhell med to kjøretøy involvert.\nViser seg at fører av det ene kjøretøyet er alkoholpåvirket. Ikke meldt om personskader. Vi har tatt beslag i førerkortet til mistenkte, samt sikret bevis opp mot kjøring i alkoholpåvirket tilstand.", "match": "Skøyenveien", "method": "gate_tekst", "unc": 430, "lat": 59.930993232558144, "lon": 10.689792941860464}, {"id": "26wvqq", "category": "Brann", "area": "Brannfjell", "text": "Nødetatene er i Vestengsvingen hvor det er meldt om røyk inne i en enebolig. Det har brent i en madrass på adressen. Brannen er slukket og vi tar avhør på stedet. Ingen er skadet. Politiet oppretter sak.", "match": "Vestengsvingen", "method": "gate_tekst", "unc": 118, "lat": 59.889320980392164, "lon": 10.800029352941177}, {"id": "268fsz", "category": "Trafikk", "area": null, "text": "Politiet har stanset en bil på E6 like ved Sandstuveien i retning Ryen. Ved kontroll av fører mistenkes det at fører er ruset på narkotika. Fører var en mann i 20 årene og han vil bli anmeldt for forholdet.", "match": "Sandstuveien", "method": "gate_tekst", "unc": 739, "lat": 59.88625416666667, "lon": 10.793566789855072}, {"id": "26cg7j", "category": "Trafikk", "area": "Frysja", "text": "Politi og ambulanse er i Frysjaveien der det er en syklist som har falt og skadet seg. Syklisten ivaretas av helsevesenet.", "match": "Frysjaveien", "method": "gate_tekst", "unc": 465, "lat": 59.96538429787234, "lon": 10.772177879432626}, {"id": "26w46k", "category": "Brann", "area": "Høybråten", "text": "Nødetatene er I Starveien hvor det har brent i en leilighet. Brannen er slukket med pulverapparat av en politipatrulje som var like i nærheten. 6 personer har evakuert seg selv på adressen. \n\nBrannvesenet jobber med utlufting. Det har brent på badet. Beboerne må bo et annet sted resten av natten da leiligheten blir plombert for videre undersøkelser. \n\nPolitiet oppretter sak.", "match": "Starveien", "method": "gate_tekst", "unc": 206, "lat": 59.943235808333334, "lon": 10.935746958333334}, {"id": "26x1x1", "category": "Trafikk", "area": "Rosenhoff", "text": "Politi og ambulanse er på stedet i Trondheimsveien i forbindelse med et sammenstøt mellom buss og elsparkesyklist. Sparkesyklisten er ved bevissthet, og blir ivaretatt av helsepersonell på stedet. Hendelsesforløpet er per nå ukjent. Det kan bli noe trafikale problemer på stedet mens nødetatene jobber. Sparkesyklisten er fraktet til sykehus for videre sjekk. Veien er åpnet igjen for trafikk. Politiet er ferdig på stedet og oppretter sak.", "match": "Trondheimsveien ved Rosenhoff", "method": "gate_omrade", "unc": 686, "lat": 59.92904382828282, "lon": 10.777574292929293}, {"id": "26bvgz", "category": "Brann", "area": null, "text": "Politi og brannvesen er i Stortingsgata etter en brannalarm som har blitt utløst. Personer har evakuert seg. Det meldes ikke om røyk eller skadde. Det har mulig vært røykutvikling på ett toalett, usikker grunn per nå. Det meldes om at det ikke har vært brann. Alarmen har blitt utløst av byggestøv i forbindelse med oppussing. Nødetatene drar fra stedet.", "match": "Stortingsgata", "method": "gate_tekst", "unc": 203, "lat": 59.91361485714286, "lon": 10.735723642857142}, {"id": "26bvkq", "category": "Brann", "area": null, "text": "Politiet er på vei Haarklous plass for å bistå brannvesenet med røyk i oppgang. Det er uvisst grunn til røyk og det er ikke meldt om skadde. Politiet ble tilkalt for å bistå brannvesenet på stedet. Da politiet ankom adressen var det branntilløp på 2 forskjellige steder. Dette fikk brannvesenet fort kontroll på. Det mistenktes at dette er påtent. Dette begrunnes med at det er avstand mellom tilløpende og at det lukter brennbar væske. Det er også sett 2 personer i tilknytning til dette. Disse søkes det etter.\n\nDet er ikke meldt om skadde og politiet vil ha tilstedeværelse i området. Det gjøres undersøkelser på stedet og politiet oppretter anmeldelse på forholdet.", "match": "Haarklous plass", "method": "gate_tekst", "unc": 108, "lat": 59.93702078947368, "lon": 10.775417631578946}, {"id": "26gs9c", "category": "Ro og orden", "area": "Sentrum", "text": "Politiet har flere ressurser i området Storgata/Brugata etter melding om en truende person med øks. To personer har vært involvert og politiet har kontroll på begge parter. Ingen personer er skadet. Det er gjort funn av redskap som kan passe til meldingen.", "match": "Storgata x Brugata", "method": "kryss", "unc": 75, "lat": 59.914559499999996, "lon": 10.753945}, {"id": "26wk09", "category": "Brann", "area": "Disen", "text": "Nødetatene er fremme i Kjelsåsveien i forbindelse med et mindre branntilfelle. Det er ikke meldt om noen personskader og brannvesenet har kontroll på stedet. Nødetatene avslutter på stedet. Politiet oppretter sak.", "match": "Kjelsåsveien ved Disen", "method": "gate_omrade", "unc": 614, "lat": 59.94733510273972, "lon": 10.790756383561645}, {"id": "26v9t9", "category": "Trafikk", "area": "St.hanshaugen", "text": "I krysset Louises gate/Ullevålsveien har det vært en trafikkulykke mellom to biler. Det er bestilt bilberger til en av bilene. \n\nAlle involverte er oppegående. En av bilene har brutt vikeplikten. Kun materielle skader. Partene fyller ut skademelding.", "match": "Louises gate x Ullevålsveien", "method": "kryss", "unc": 75, "lat": 59.927732, "lon": 10.7389475}, {"id": "26sv1x", "category": "Trafikk", "area": "Østre Aker Vei Inngående", "text": "Mellom Grorud og Veitvet. Flere biler involvert. Uavklart skadeomfang. Store trafikale utfordringer på stedet. Nødetatene og bergingsbil er på vei. Vi er på stedet. Hele Østre Aker vei er sperret. Vi anbefaler alternative kjøreruter på det sterkeste. Det er så langt ikke meldt om alvorlig personskade. Det pågår opprydningsarbeid på stedet. Det er fire personbiler og en buss som må berges på stedet. Da er politet og bilberger ferdige på stedet, veien er nå åpnet igjen. Det er fire personer som er undersøkt av ambulanse på stedet og kjørt legevakt. De betegnes som lettere skadet. Vi oppreter sak på forholdet.\n\nDet fremstår som en kjedekollisjon. Politiet vil gjøre videre underøkelser i etterforskningen for å få klarhet i hendelsesforløpet.", "match": "Østre Aker vei", "method": "gate_tekst", "unc": 3129, "lat": 59.939775078125, "lon": 10.851320171875}, {"id": "269342", "category": "Trafikk", "area": "Bekkelaget", "text": "Patrulje er i Bekkelagsveien hvor det er meldt om en anleggsmaskin som står å blokkerer veien. Det jobbes med å kartlegge hva som har skjedd. Det jobbes med å fjerne denne nå.", "match": "Bekkelagsveien", "method": "gate_tekst", "unc": 234, "lat": 59.883229, "lon": 10.773655796296296}, {"id": "26sjk4", "category": "Tyveri", "area": "Carl Berner", "text": "Vi har stanset en stjålet bil og tatt kontroll på en biltyv i Hausmannsgate etter at et matbud meldte at noen hadde stjålet bilen hans ved Carl Berner. Biltyven kjøres arresten. Biltyven blir fremstilt for lege, mistanke om kjøring i påvirket tilstand.", "match": "Hausmanns gate", "method": "gate_tekst", "unc": 271, "lat": 59.9175548372093, "lon": 10.754518232558139}, {"id": "2641qf", "category": "Brann", "area": "Rodeløkka", "text": "Nødetatene er i Fagerheimgata 6 etter melding om brann i en søppelbil. Har kommet noen mindre smell ifbm brannen. Ikke fare for tredjeperson og ingen spredningsfare. Brannen er slukket.", "match": "Fagerheimgata 6", "method": "adresse", "unc": 25, "lat": 59.927809863925, "lon": 10.765854469854068}, {"id": "265gr7", "category": "Brann", "area": "Majorstua", "text": "Nødetatene rykker ut til Thaulows vei, hvor det er meldt om røykutvikling fra et bygg. Per nå er omstendigheter og omfang ukjent. Nødetatene er straks ferdig fra stedet og sak opprettes.", "match": "Thaulows vei", "method": "gate_tekst", "unc": 138, "lat": 59.933655574468084, "lon": 10.70726085106383}];
const verdict = {};
try { Object.assign(verdict, JSON.parse(localStorage.getItem("m0-street-verdicts") || "{}")); } catch (e) {}
function save(){ try { localStorage.setItem("m0-street-verdicts", JSON.stringify(verdict)); } catch (e) {} }
function score(){
  const v = Object.values(verdict), ok = v.filter(x => x === "ok").length;
  document.getElementById("score").textContent =
    `Reviewed ${v.length} of ${ROWS.length} · street right: ${ok}` + (v.length ? ` (${Math.round(100*ok/v.length)} %)` : "");
}
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const list = document.getElementById("list");
ROWS.forEach((r, i) => {
  const el = document.createElement("section");
  el.className = "card " + (verdict[r.id] || "");
  el.innerHTML = `<div class="txt"><div class="meta">#${i+1} · ${esc(r.id)} · ${esc(r.category)} · area: ${esc(r.area || "—")}</div>
    <div class="match">${esc(r.match)} <span class="meta">(${esc(r.method)}, ±${r.unc} m)</span></div>
    <div class="police">${esc(r.text)}</div>
    <div class="btns"><button class="b-ok">Street right</button><button class="b-bad">Wrong street</button></div></div>
    <div class="map" id="m${i}"></div>`;
  list.appendChild(el);
  for (const [cls, val] of [["b-ok","ok"],["b-bad","bad"]]) el.querySelector("."+cls).onclick = () => {
    verdict[r.id] = val; el.className = "card " + val; save(); score();
  };
  const m = L.map("m"+i, {scrollWheelZoom:false}).setView([r.lat, r.lon], 15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(m);
  L.circle([r.lat, r.lon], {radius: r.unc, weight: 1}).addTo(m);
  L.circleMarker([r.lat, r.lon], {radius: 4}).addTo(m);
  m.fitBounds(L.circle([r.lat, r.lon], {radius: Math.max(r.unc, 150)}).addTo(m).getBounds());
});
score();
</script></body></html>
